<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Search</title>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="tb-left">
      <button class="waffle" title="App launcher" aria-label="App launcher"></button>
      <div class="brand">
        <span class="logo-slot" aria-hidden="true"></span>
        <span class="brand-name">Smart<br>Search</span>
      </div>
      <span class="brand-divider"></span>
      <span class="product-name">Enterprise Search</span>
    </div>

    <div class="searchwrap">
      <div class="searchbox">
        <button class="back" id="backbtn" title="Back" aria-label="Back"></button>
        <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search apps, files, sites, and people" aria-label="Search">
        <button class="searchbtn" id="searchbtn" title="Search" aria-label="Search"></button>
      </div>
      <div class="typeahead" id="typeahead" style="display:none"></div>
    </div>

    <div class="tb-right">
      <button class="tb-ico" id="ico-contact" title="Contacts" aria-label="Contacts"></button>
      <button class="tb-ico" id="ico-gear" title="Settings" aria-label="Settings"></button>
      <button class="tb-ico" id="ico-help" title="Help" aria-label="Help"></button>
      <button class="avatar" title="Sam Miller">SM</button>
    </div>
  </header>

  <!-- Shell -->
  <div class="shell">
    <nav class="rail">
      <button id="rail-home" title="Home" aria-label="Home"></button>
      <button id="rail-globe" title="Sites" aria-label="Sites"></button>
      <button id="rail-card" title="Apps" aria-label="Apps"></button>
      <button id="rail-doc" title="Files" aria-label="Files"></button>
      <span class="spacer"></span>
      <button id="rail-plus" title="Create" aria-label="Create"></button>
    </nav>
    <main class="main">
      <div class="content" id="content"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
  <script>
    /* inject static chrome icons (defined in app.js's I map) */
    document.addEventListener("DOMContentLoaded", function(){
      document.querySelector(".waffle").innerHTML = I.waffle;
      document.querySelector(".logo-slot").innerHTML = I.logo;
      document.getElementById("backbtn").innerHTML = I.back;
      document.getElementById("searchbtn").innerHTML = I.search;
      document.getElementById("ico-contact").innerHTML = I.contact;
      document.getElementById("ico-gear").innerHTML = I.gear;
      document.getElementById("ico-help").innerHTML = I.help;
      document.getElementById("rail-home").innerHTML = I.home;
      document.getElementById("rail-globe").innerHTML = I.globe.replace('width="14" height="14"','width="20" height="20"');
      document.getElementById("rail-card").innerHTML = I.card;
      document.getElementById("rail-doc").innerHTML = I.docTile.replace('width="18" height="18"','width="20" height="20"');
      document.getElementById("rail-plus").innerHTML = I.plus;
    });
  </script>
</body>
</html>
